services:
  kernel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wattetheria-kernel
    restart: unless-stopped
    environment:
      WATTETHERIA_DATA_DIR: /var/lib/wattetheria
      WATTETHERIA_CONTROL_PLANE_BIND: 0.0.0.0:7777
      WATTETHERIA_MCP_TOKEN_AUTH: ${WATTETHERIA_MCP_TOKEN_AUTH:-false}
      WATTETHERIA_MCP_PUBLIC_BIND: ${WATTETHERIA_MCP_PUBLIC_BIND:-}
      WATTETHERIA_MCP_PUBLIC_BASE_URL: ${WATTETHERIA_MCP_PUBLIC_BASE_URL:-}
    volumes:
      - wattetheria_state:/var/lib/wattetheria
    ports:
      - "${WATTETHERIA_CONTROL_PLANE_PORT:-7777}:7777"
      - "${WATTETHERIA_MCP_PUBLIC_BIND_HOST:-127.0.0.1}:${WATTETHERIA_MCP_PUBLIC_PORT:-7778}:7778"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7777/supervision >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    entrypoint: ["/app/scripts/docker-kernel-entrypoint.sh"]

volumes:
  wattetheria_state:
