name: npm-native-cli-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Wattetheria product version to publish, matching the GHCR image tag (for example 1.0.7).
        required: true
        type: string
      previous_manifest_path:
        description: Previous stack manifest path for the first release; leave empty later to use the latest release asset.
        required: false
        default: .github/release/stack-baseline.json
        type: string
      dry_run:
        description: Build and verify native assets without creating or updating a GitHub Release.
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  native:
    name: Build native runtime ${{ matrix.target_key }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_key: darwin-arm64
            runs_on: macos-latest
            platform: darwin
            arch: arm64
            binary: target/release/wattetheria-client-cli
            exe: ""
          - target_key: darwin-x64
            runs_on: macos-15-intel
            platform: darwin
            arch: x64
            binary: target/release/wattetheria-client-cli
            exe: ""
          - target_key: linux-arm64
            runs_on: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: target/release/wattetheria-client-cli
            exe: ""
          - target_key: linux-x64
            runs_on: ubuntu-latest
            platform: linux
            arch: x64
            binary: target/release/wattetheria-client-cli
            exe: ""
          - target_key: win32-arm64
            runs_on: windows-11-arm
            platform: win32
            arch: arm64
            binary: target/release/wattetheria-client-cli.exe
            exe: ".exe"
          - target_key: win32-x64
            runs_on: windows-latest
            platform: win32
            arch: x64
            binary: target/release/wattetheria-client-cli.exe
            exe: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Validate release version and branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Product releases must be run from main." >&2
            exit 1
          fi
          if ! printf '%s' "${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "release_version must be a semantic version without the v prefix." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-did
          path: deps/watt-did
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-wallet
          path: deps/watt-wallet
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-credential
          path: deps/watt-credential
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: wattetheria/wattswarm
          path: deps/wattswarm
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Prepare workspace dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf ../watt-did ../watt-wallet ../watt-credential ../wattswarm
          cp -R deps/watt-did ../watt-did
          cp -R deps/watt-wallet ../watt-wallet
          cp -R deps/watt-credential ../watt-credential
          cp -R deps/wattswarm ../wattswarm

      - name: Prepare workspace dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($dep in @("watt-did", "watt-wallet", "watt-credential", "wattswarm")) {
            $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) $dep
            if (Test-Path $target) {
              Remove-Item $target -Recurse -Force
            }
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "deps/$dep") $target -Recurse
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-release-${{ matrix.target_key }}
          workspaces: |
            . -> target
            ../wattswarm -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build native CLI and Wattetheria kernel
        run: cargo build --release -p wattetheria-client-cli -p wattetheria-kernel

      - name: Build Wattswarm node binaries
        run: cargo build --release --manifest-path ../wattswarm/Cargo.toml -p wattswarm --bin wattswarm --bin wattswarm-runtime

      - name: Stage native release assets
        run: >
          node scripts/stage-native-cli.js
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --source ${{ matrix.binary }}
          --extra target/release/wattetheria-kernel${{ matrix.exe }}
          --extra ../wattswarm/target/release/wattswarm${{ matrix.exe }}
          --extra ../wattswarm/target/release/wattswarm-runtime${{ matrix.exe }}
          --release-assets-dir release-assets

      - name: Verify native binaries
        run: node scripts/check-native-package-binary.js npm/native/${{ matrix.target_key }}

      - name: Verify package contents
        run: npm pack npm/native/${{ matrix.target_key }} --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: wattetheria-native-${{ matrix.target_key }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  release-artifacts:
    if: ${{ !inputs.dry_run }}
    needs: native
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: v${{ inputs.release_version }}
      previous_manifest_path: ${{ inputs.previous_manifest_path }}
    secrets: inherit

  publish-native-assets:
    if: ${{ !inputs.dry_run }}
    needs:
      - native
      - release-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wattetheria-native-*
          path: native-release-assets
          merge-multiple: true

      - name: Validate collected native assets
        run: |
          count=$(find native-release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$count" -ne 24 ]; then
            echo "Expected 24 native release assets, found $count." >&2
            exit 1
          fi

      - name: Attach native assets to the product release
        env:
          GH_TOKEN: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: v${{ inputs.release_version }}
        run: gh release upload "$RELEASE_TAG" --repo wattetheria/wattetheria --clobber native-release-assets/*
