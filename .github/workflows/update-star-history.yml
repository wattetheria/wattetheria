name: update-star-history

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test generator
        run: node --test tests/star-history.test.js

      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-star-history.js

      - name: Commit updated chart
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- .github/assets/star-history.svg)" ]; then
            echo "Star history chart is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/star-history.svg
          git commit -m "docs: update star history chart"
          git pull --rebase origin main
          git push origin HEAD:main
