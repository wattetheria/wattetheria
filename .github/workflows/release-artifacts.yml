name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.0.4'
        required: true
        type: string
      previous_manifest_path:
        description: 'Previous stack manifest path for the first release; leave empty later to use the latest release asset'
        required: false
        default: '.github/release/stack-baseline.json'
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, for example v1.0.4
        required: true
        type: string
      previous_manifest_path:
        description: Previous stack manifest path for the first release; leave empty later to use the latest release asset
        required: false
        default: .github/release/stack-baseline.json
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate release inputs
        id: release-inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_MANIFEST_PATH: ${{ inputs.previous_manifest_path }}
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Stack releases must be run from main."
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v."
              exit 1
              ;;
          esac

          release_version="${RELEASE_TAG#v}"
          if [ -z "$release_version" ]; then
            echo "Release version is empty after removing the v prefix."
            exit 1
          fi

          case "$PREVIOUS_MANIFEST_PATH" in
            "" )
              previous_manifest=""
              ;;
            /* | *..* )
              echo "previous_manifest_path must be a relative path inside the wattetheria checkout."
              exit 1
              ;;
            * )
              previous_manifest="$GITHUB_WORKSPACE/wattetheria/$PREVIOUS_MANIFEST_PATH"
              ;;
          esac

          {
            echo "release_version=$release_version"
            echo "previous_manifest=$previous_manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout wattetheria
        uses: actions/checkout@v4
        with:
          repository: wattetheria/wattetheria
          ref: ${{ github.ref_name }}
          path: wattetheria
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout wattswarm
        uses: actions/checkout@v4
        with:
          repository: wattetheria/wattswarm
          ref: main
          path: wattswarm
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout watt-did
        uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-did
          ref: main
          path: watt-did
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout watt-wallet
        uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-wallet
          ref: main
          path: watt-wallet
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout watt-credential
        uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-credential
          ref: main
          path: watt-credential
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout watt-registry
        uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-registry
          ref: main
          path: watt-registry
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout watt-servicenet
        uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-servicenet
          ref: main
          path: watt-servicenet
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout watt-gateway
        uses: actions/checkout@v4
        with:
          repository: wattetheria/watt-gateway
          ref: main
          path: watt-gateway
          fetch-depth: 0
          token: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Validate release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_MANIFEST: ${{ steps.release-inputs.outputs.previous_manifest }}
        run: |
          if [ -n "$PREVIOUS_MANIFEST" ] && [ ! -f "$PREVIOUS_MANIFEST" ]; then
            echo "Previous stack manifest does not exist: $PREVIOUS_MANIFEST"
            exit 1
          fi

      - name: Generate stack release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}
          RELEASE: ${{ steps.release-inputs.outputs.release_version }}
          PREVIOUS_STACK_MANIFEST: ${{ steps.release-inputs.outputs.previous_manifest }}
          STACK_RELEASE_REPO: wattetheria/wattetheria
          STACK_RELEASE_WORKSPACE: ${{ github.workspace }}
          STACK_RELEASE_OUT_DIR: ${{ github.workspace }}/stack-release
        run: node wattetheria/scripts/generate-stack-release.js

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WATTETHERIA_RELEASE_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.release_version }}
        run: |
          set -euo pipefail
          release_title="Wattetheria Stack ${RELEASE_VERSION}"
          release_notes="stack-release/release-notes.md"
          release_manifest="stack-release/release-manifest.${RELEASE_VERSION}.json"
          release_target="$(git -C wattetheria rev-parse HEAD)"
          release_args=(--repo wattetheria/wattetheria --title "$release_title" --notes-file "$release_notes")

          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc) ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" --repo wattetheria/wattetheria >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" --target "$release_target" "${release_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" \
            --repo wattetheria/wattetheria \
            --clobber \
            "$release_manifest"
