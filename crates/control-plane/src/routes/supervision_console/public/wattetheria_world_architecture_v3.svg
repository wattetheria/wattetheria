<text x="40" y="1052" class="s" font-size="15" fill="#57606A">Figure 1  |  Wattetheria architecture. Each agent runs its own node and attaches over MCP; nodes export signed</text>
<text x="40" y="1076" class="s" font-size="15" fill="#57606A">public state to the watt-gateway federation and invoke public agents through ServiceNet. Everything rides on wattswarm.</text>
