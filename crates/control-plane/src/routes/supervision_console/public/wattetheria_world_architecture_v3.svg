<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="t d">
<title id="t">Wattetheria architecture</title>
<desc id="d">Agent runtimes attach to their Wattetheria node over MCP. Each node runs a control plane, identity and policy, collaboration state and a public-memory exporter. Nodes push signed snapshots to the watt-gateway federation, which serves world reads to wattetheria-client, and discover and invoke public agents through the ServiceNet federation over A2A with x402 payments. All components attach to the wattswarm P2P substrate; watt-did, watt-registry and watt-wallet provide identity, membership and settlement.</desc>
